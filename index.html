<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strona z tłem jako obraz</title>
  <style>
    /* Ustawienia tła dla całej strony */
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background-image: url('tlo.jpg');        /* podmień na ścieżkę do swojego obrazu */
      background-size: cover;                  /* wypełnia ekran, zachowuje proporcje */
      background-position: center;             /* centrowanie obrazu */
      background-repeat: no-repeat;            /* brak powtarzania */
      background-attachment: fixed;            /* „paralaksa” – tło nie przewija się */
      color: #ffffff;                          /* czytelny tekst na tle */
      font-family: system-ui, Arial, sans-serif;
    }

    /* Półprzezroczysta warstwa dla lepszej czytelności treści */
    .overlay {
      background: rgba(0, 0, 0, 0.45);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    /* Kontener treści */
    .card {
      max-width: 800px;
      backdrop-filter: blur(2px);
      border-radius: 12px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="card">
      <h1>Konkurs</h1>
     
      <a class="btn" href="#więcej">Zobacz więcej</a>
    </div>
  </div>
</body>
</html>
