<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konkurs League of Legends</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background-image: url('t.png'); /* tło strony */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #f0e6d2;
      font-family: 'Cinzel', serif;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.6);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }


       /* Kwadrat z tłem obrazka path.jpg */
    .card {
      width: 800px;
      height: 900px;
      background-image: url('bla.PNG'); /* ← tu podłączasz swój obrazek */
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(200, 170, 110, 0.5);
    }

    /* Kwadrat z tłem obrazka path.jpg */
    .card {
      width: 500px;
      height: 600px;
      background-image: url('gold-frame-with-black-background-with-gold-frame_406811-22460.avif'); /* ← tu podłączasz swój obrazek */
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(200, 170, 110, 0.5);
    }

    /* Czarny przycisk w środku */
    .btn-square {
      width: 150px;
      height: 60px;
      background-color: black;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #c8aa6e;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn-square:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(200, 170, 110, 0.6);
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="card">
      <a href="index2podstrona.html" class="btn-square">AA</a>
    </div>
  </div>
</body>
</html>
