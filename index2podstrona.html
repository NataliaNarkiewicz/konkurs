<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>League of Legends – Strona</title>
  <style>
    /* Ogólne ustawienia */
    body {
      margin: 0;
      font-family: 'Cinzel', serif;
      color: #f5f5f5;
      background-image: url('lol_background.jpg'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Nakładka dla czytelności */
    .overlay {
      background: rgba(0, 0, 0, 0.7);
      min-height: 100vh;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 2.5rem;
      color: #d4af37; /* złoty kolor */
      text-shadow: 2px 2px 6px #000;
      margin-bottom: 2rem;
    }

    table {
      border-collapse: collapse;
      margin: 1.5rem 0;
      width: 80%;
      max-width: 600px;
      background: rgba(20, 20, 20, 0.85);
      border: 2px solid #d4af37;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    th, td {
      padding: 1rem;
      text-align: center;
      border: 1px solid #d4af37;
    }

    th {
      background: rgba(212, 175, 55, 0.2);
      font-size: 1.2rem;
      color: #d4af37;
    }

    a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #fff;
    }
  </style>
  <!-- Czcionka fantasy -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="overlay">
    <h1>Witaj w świecie League of Legends</h1>

    <!-- Tabela z regulaminem -->
    <table>

      </tr>

      </tr>
    </table>

<table>

    <!-- Tabela z formularzem -->
    <table>
      <tr>
        <th>Formularz</th>
      </tr>
      <tr>
        <td><a href="formularz.html" target="_blank">Wypełnij formularz</a></td>
      </tr>
    </table>
  </div>
</body>

  <style>
    /* Ustawienia tła dla całej strony */
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background-image: url('StockCake.com-Royal Golden Border (1).jpg');        /* podmień na ścieżkę do swojego obrazu */
      background-size: cover;                  /* wypełnia ekran, zachowuje proporcje */
      background-position: center;             /* centrowanie obrazu */
      background-repeat: no-repeat;            /* brak powtarzania */
      background-attachment: fixed;            /* „paralaksa” – tło nie przewija się */
      color: #ffffff;                          /* czytelny tekst na tle */
      font-family: system-ui, Arial, sans-serif;
    }

    /* Półprzezroczysta warstwa dla lepszej czytelności treści */
  /*  .overlay { */

      /*display: flex; */
    /*  align-items: center; */
     /* justify-content: center; */
      /*text-align: center; */
     /* padding: 2rem; */
   /* } */

    /* Kontener treści */
    .card {
      max-width: 800px;
      backdrop-filter: blur(2px);
      border-radius: 12px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
  </style>
</head>
